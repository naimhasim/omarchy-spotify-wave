## Spotify Wave: a 10-band peaking EQ applied per-app to the Spotify
## (librespot / spotifyd) playback stream. The same sink is what the desktop
## visualizer captures (`spotify_wave.monitor`), so one graph serves both halves.
##
## Intentionally a plain filter-chain sink rather than a WirePlumber smart
## filter. Smart filters are broken on this PipeWire version -- Omarchy's own
## dell-xps-2026 tuning carries the same note: the graph loads and links
## correctly and then passes audio through unprocessed. A plain sink plus a
## pulse.rules match (pipewire/pipewire-pulse.conf.d/60-spotify-wave.conf) is the
## shape that works here.
##
## No top-level inputs/outputs: PipeWire duplicates the graph per channel, so the
## biquads run on FL and FR separately while the controls stay shared -- exactly
## one band_N:Gain / preamp:Mult for both channels.
##
## Live controls (node must be running; see node.always-process below):
##   id=$(pw-dump | jq -r '.[]|select(.info.props["node.name"]=="spotify_wave")|.id')
##   pw-cli set-param "$id" Props '{ params = [ "band_1:Gain" 3.0 ] }'

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Spotify Wave"
      media.name        = "Spotify Wave"

      filter.graph = {
        nodes = [
          { type = builtin name = preamp label = linear control = { "Mult" = 1.0 } }

          { type = builtin name = band_1  label = bq_peaking control = { "Freq" = 31.0    "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_2  label = bq_peaking control = { "Freq" = 62.0    "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_3  label = bq_peaking control = { "Freq" = 125.0   "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_4  label = bq_peaking control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_5  label = bq_peaking control = { "Freq" = 500.0   "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_6  label = bq_peaking control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_7  label = bq_peaking control = { "Freq" = 2000.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_8  label = bq_peaking control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_9  label = bq_peaking control = { "Freq" = 8000.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = band_10 label = bq_peaking control = { "Freq" = 16000.0 "Q" = 1.0 "Gain" = 0.0 } }
        ]

        links = [
          { output = "preamp:Out" input = "band_1:In" }
          { output = "band_1:Out"  input = "band_2:In" }
          { output = "band_2:Out"  input = "band_3:In" }
          { output = "band_3:Out"  input = "band_4:In" }
          { output = "band_4:Out"  input = "band_5:In" }
          { output = "band_5:Out"  input = "band_6:In" }
          { output = "band_6:Out"  input = "band_7:In" }
          { output = "band_7:Out"  input = "band_8:In" }
          { output = "band_8:Out"  input = "band_9:In" }
          { output = "band_9:Out"  input = "band_10:In" }
        ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "spotify_wave"
        media.class = Audio/Sink
        session.suspend-timeout-seconds = 0
        # A suspended filter-chain re-applies its config defaults on the next
        # activation, so controls set while idle (spotify-wave apply on plugin
        # load, before Spotify plays) would be discarded. Keeping the graph
        # live makes set-param stick regardless of playback state.
        node.always-process = true
      }
      playback.props = {
        node.name     = "spotify_wave_output"
        node.passive  = true
        node.dont-move = true
        session.suspend-timeout-seconds = 0
        # No target.object: the output follows the current default sink.
      }
    }
  }
]

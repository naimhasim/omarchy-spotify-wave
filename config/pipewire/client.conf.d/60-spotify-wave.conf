## Route native PipeWire Spotify streams into the Spotify Wave filter-chain sink
## from pipewire/filter-chain.conf.d/60-spotify-wave.conf.
##
## The official Spotify desktop client connects to PipeWire itself (native
## protocol), so pipewire-pulse's pulse.rules never see its stream, and on
## WirePlumber 0.5.17 stream.rules update-props never reaches the stream node
## either. Client-side stream.rules are applied by the client when it creates the
## stream, so "target.object" is present before WirePlumber's
## find-defined-target runs. That is the one path that covers a native client.
##
## Only this stream is moved; spotify_wave is NOT made the default sink. Matches
## mirror pipewire/pipewire-pulse.conf.d/60-spotify-wave.conf and
## wireplumber/wireplumber.conf.d/60-spotify-wave.conf: the stable key is
## application.process.binary ("spotify" for the official client, "spotifyd" /
## "librespot" for the backends); the name matches cover other builds.

stream.rules = [
  {
    matches = [
      { application.process.binary = "spotify" }
      { application.process.binary = "omarchy-spotify-backend" }
      { application.process.binary = "spotifyd" }
      { application.process.binary = "librespot" }
      { application.name = "Spotify" }
      { application.name = "Spotifyd" }
      { application.name = "librespot" }
    ]
    actions = {
      update-props = {
        target.object = "spotify_wave"
      }
    }
  }
]

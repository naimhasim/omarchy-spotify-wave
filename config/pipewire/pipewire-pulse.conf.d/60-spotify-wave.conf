## Route PulseAudio-protocol Spotify playback into the Spotify Wave filter-chain
## sink from pipewire/filter-chain.conf.d/60-spotify-wave.conf. This covers the
## librespot / spotifyd backends. It does NOT cover the official Spotify desktop
## client: that one connects to PipeWire directly (native protocol) and never
## reaches this module, so it is routed by
## pipewire/client.conf.d/60-spotify-wave.conf instead. The visualizer captures
## the same sink's monitor.
##
## This lives in pipewire-pulse.conf.d rather than wireplumber.conf.d on purpose.
## spotifyd plays through librespot's PulseAudio backend, and on WirePlumber
## 0.5.17 `stream.rules` update-props never reaches the stream node's properties
## (state-stream.lua merges the result into a local table and does not write it
## back), so a WirePlumber `target.object` rule does not route anything. The
## pulse module applies update-props to the stream before the node is created,
## where "target.object" is honoured by WirePlumber's find-defined-target.
##
## Only this stream is moved; spotify_wave is NOT made the default sink.
##
## Identity measured on this machine: the spotifyd stream publishes
## application.name = "" and node.name = ""; application.process.binary =
## "spotifyd" is the only stable key there. Field edits are OR-combined, so the
## name matches cover other PulseAudio-protocol Spotify builds too.

pulse.rules = [
  {
    matches = [
      { application.process.binary = "omarchy-spotify-backend" }
      { application.process.binary = "spotifyd" }
      { application.process.binary = "librespot" }
      { application.process.binary = "spotify" }
      { application.name = "Spotifyd" }
      { application.name = "librespot" }
      { application.name = "Spotify" }
    ]
    actions = {
      update-props = {
        target.object = "spotify_wave"
      }
    }
  }
]

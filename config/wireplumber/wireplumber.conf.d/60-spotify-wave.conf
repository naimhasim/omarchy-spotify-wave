## Spotify Wave stream rules companion.
##
## The routing itself is done by
## pipewire/pipewire-pulse.conf.d/60-spotify-wave.conf, because on WirePlumber
## 0.5.17 `stream.rules` update-props is merged into a local table in
## state-stream.lua and never written back to the stream node, so a
## `target.object` rule here does not actually route. This file still matters:
## it sets `state.restore-target = false` for the Spotify stream so WirePlumber
## does not restore a previously stored target over the pulse-assigned one, and
## it is forward-compatible should update-props be written through again.
##
## Do not make "spotify_wave" the default sink; only this stream moves. Matches
## cover both the official Spotify desktop client (application.name "Spotify",
## binary "spotify") and the librespot / spotifyd backends.
##
## Identity measured on this machine: for spotifyd, application.name = "" and
## node.name = ""; application.process.binary = "spotifyd" is the stable key.
## Name matches cover other Spotify builds as an OR fallback.

stream.rules = [
  {
    matches = [
      { application.process.binary = "omarchy-spotify-backend" }
      { application.process.binary = "spotifyd" }
      { application.process.binary = "librespot" }
      { application.process.binary = "spotify" }
      { application.name = "Spotifyd" }
      { application.name = "librespot" }
      { application.name = "Spotify" }
    ]
    actions = {
      update-props = {
        target.object = "spotify_wave"
        state.restore-target = false
      }
    }
  }
]
